spring.application.name=${APP_NAME:professy}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}

# For RDS set DB_URL to the RDS JDBC URL with sslMode=REQUIRED and the /professy database.
# The default is deliberately loopback-only for local development.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/professy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:professy_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA owns relational table creation/update. Keep update as the default for this internal service.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
logging.level.org.hibernate.tool.schema=${HIBERNATE_SCHEMA_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:OFF}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:OFF}

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
app.events.topic=${APP_EVENTS_TOPIC:professy.ticket-events.v1}
app.events.publish-delay-ms=${APP_EVENTS_PUBLISH_DELAY_MS:1000}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:26MB}
app.attachments.directory=${ATTACHMENT_DIRECTORY:./.runtime/attachments}
app.ui-url=${APP_UI_URL:http://localhost:4200}
app.notification-service-url=${NOTIFICATION_SERVICE_URL:http://127.0.0.1:8082}
app.internal-service-token=${PROFESSY_SERVICE_TOKEN:}
app.identity-service-token=${IDENTITY_SERVICE_TOKEN:}
app.meetings.ice-servers=${MEETING_ICE_SERVERS:[]}
app.sprint-lifecycle.enabled=${SPRINT_LIFECYCLE_ENABLED:true}

# Optional local or S3 avatar storage settings.
app.media.driver=${APP_MEDIA_DRIVER:local}
app.media.directory=${APP_MEDIA_DIRECTORY:${user.home}/.local/share/professy/avatars}
app.media.public-base-url=${APP_MEDIA_PUBLIC_BASE_URL:http://localhost:8080/media/avatars}
app.media.s3.bucket=${APP_MEDIA_S3_BUCKET:}
app.media.s3.region=${AWS_REGION:us-east-1}
app.media.s3.endpoint=${APP_MEDIA_S3_ENDPOINT:}
app.media.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.media.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.media.s3.session-token=${AWS_SESSION_TOKEN:}
