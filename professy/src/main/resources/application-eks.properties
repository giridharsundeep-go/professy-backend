# AWS EKS profile. Activate with SPRING_PROFILES_ACTIVE=eks.
# Set RDS_HOST to the private RDS endpoint; supply DB_USERNAME and DB_PASSWORD from runtime secrets.
server.address=0.0.0.0
spring.datasource.url=jdbc:mysql://${RDS_HOST}:${RDS_PORT:3306}/professy?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
